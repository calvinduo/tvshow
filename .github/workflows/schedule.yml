name: DMM API Scraper

# 触发条件
on:
  schedule:
    # 每天 UTC 时间 16:00 执行 (对应日本时间 JST 每天凌晨 1:00)
    - cron: '0 16 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行按钮进行测试

jobs:
  run-scraper:
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 环境

    steps:
      # 1. 检出当前仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖库
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 运行抓取脚本
      - name: Run DMM Scraper
        run: python dmm_scraper.py

      # 5. 提交并推送生成的 txt 文件到仓库
      - name: Commit and Push Changes
        run: |
          # 配置 Git 机器人信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加生成的 txt 文件
          git add dmm_ending_soon_ids_all.txt dmm_ending_soon_ids_exclusive.txt
          
          # 如果文件有变动则提交并推送 (忽略没有变动时的报错)
          git diff --staged --quiet || (git commit -m "Auto-update DMM IDs [$(date +'%Y-%m-%d %H:%M:%S')]" && git push)
