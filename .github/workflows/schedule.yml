name: DMM API Scraper

# 定义触发条件
on:
  schedule:
    # 每天 UTC 时间 16:00 自动执行 (等于日本时间 JST 每天凌晨 1:00)
    - cron: '0 16 * * *'
  # 允许你在 GitHub 仓库的 Actions 面板里手动点击 "Run workflow" 按钮执行
  workflow_dispatch: 

jobs:
  run-scraper:
    runs-on: ubuntu-latest # 使用 GitHub 免费提供的 Linux 虚拟机

    # 设置机器人的权限，允许它将生成的文件写回到你的代码仓库中
    permissions:
      contents: write

    steps:
      # 1. 下载当前仓库的所有代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装 Python 所需的第三方请求库
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 执行我们编写的抓取脚本
      - name: Run DMM Scraper
        run: python dmm_scraper.py

      # 5. 将抓取产生的新文件 (txt, json, README) 自动提交并保存到仓库
      - name: Commit and Push Changes
        run: |
          # 设定虚拟机器人的名字和邮箱
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 追踪所有新生成或发生变化的文件
          git add -A
          
          # 检查是否有文件发生变化，如果有，则提交并推送到 GitHub
          git diff --staged --quiet || (git commit -m "🚀 Auto-update DMM exclusive videos [$(date +'%Y-%m-%d')]" && git push)
